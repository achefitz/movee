# Refuse npm releases younger than a day (supply-chain attack buffer).
minimumReleaseAge: 1440

packages:
  - apps/*
  - packages/*

catalog:
  '@types/node': ^22.18.0
  drizzle-orm: ^0.45.1
  tsx: ^4.21.0
  zod: ^3.25.76
  # Exact versions required by Expo SDK 54
  react: 19.1.0
  react-dom: 19.1.0

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
